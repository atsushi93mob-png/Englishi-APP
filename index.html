<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>はじめての英会話 🗣️</title>
<style>
  :root {
    --bg1: #10233a;
    --bg2: #1d3a5f;
    --accent: #4da3ff;
    --accent-dark: #2b7bd6;
    --good: #46d38a;
    --bad: #ff7a7a;
    --gold: #ffcf5c;
    --text: #eaf2ff;
    --muted: #9db4d0;
    --panel: rgba(255,255,255,0.06);
    --panel-2: rgba(255,255,255,0.10);
    --panel-border: rgba(255,255,255,0.14);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { min-height: 100%; }
  body {
    font-family: "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    background: radial-gradient(circle at 50% 0%, var(--bg2), var(--bg1) 70%);
    background-attachment: fixed;
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 14px 40px;
  }
  header { text-align: center; margin-bottom: 14px; }
  h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: 0.02em; }
  .subtitle { color: var(--muted); font-size: 0.82rem; margin-top: 4px; }

  .app { width: 100%; max-width: 480px; }

  /* Stats bar */
  .stats {
    display: flex; gap: 8px; margin-bottom: 16px;
  }
  .stat {
    flex: 1; background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 10px 6px; text-align: center;
  }
  .stat .num { font-size: 1.25rem; font-weight: 700; color: var(--accent); }
  .stat .lbl { font-size: 0.68rem; color: var(--muted); margin-top: 2px; }

  /* Tabs */
  .tabs {
    display: flex; gap: 6px; margin-bottom: 16px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 5px;
  }
  .tab {
    flex: 1; padding: 9px 4px; border: none; border-radius: 10px;
    background: transparent; color: var(--muted); font-size: 0.8rem;
    font-weight: 600; cursor: pointer; transition: all 0.15s; font-family: inherit;
  }
  .tab.active { background: var(--accent); color: #06192e; }

  .screen { display: none; }
  .screen.active { display: block; animation: fade 0.25s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* Category list */
  .cat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .cat-card {
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 16px; padding: 16px 12px; cursor: pointer; text-align: left;
    transition: transform 0.12s, background 0.15s; font-family: inherit; color: var(--text);
  }
  .cat-card:hover { background: var(--panel-2); transform: translateY(-2px); }
  .cat-card .emoji { font-size: 1.8rem; }
  .cat-card .title { font-weight: 700; font-size: 0.95rem; margin-top: 6px; }
  .cat-card .en { font-size: 0.72rem; color: var(--muted); }
  .cat-card .prog {
    margin-top: 10px; height: 6px; background: rgba(255,255,255,0.12);
    border-radius: 4px; overflow: hidden;
  }
  .cat-card .prog span { display: block; height: 100%; background: var(--good); width: 0%; transition: width 0.4s; }
  .cat-card .prog-txt { font-size: 0.66rem; color: var(--muted); margin-top: 4px; }

  /* Back button */
  .back {
    background: none; border: none; color: var(--accent); font-size: 0.85rem;
    cursor: pointer; padding: 4px 0; margin-bottom: 12px; font-family: inherit; font-weight: 600;
  }

  .section-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .section-head h2 { font-size: 1.1rem; }
  .mode-switch { display: flex; gap: 6px; }
  .mini-btn {
    background: var(--panel); border: 1px solid var(--panel-border); color: var(--text);
    border-radius: 10px; padding: 6px 12px; font-size: 0.76rem; cursor: pointer;
    font-family: inherit; font-weight: 600;
  }
  .mini-btn.active { background: var(--accent); color: #06192e; border-color: var(--accent); }

  /* Phrase card */
  .phrase {
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 16px; padding: 16px; margin-bottom: 10px;
  }
  .phrase .en-row { display: flex; align-items: flex-start; gap: 10px; }
  .phrase .en-text { font-size: 1.15rem; font-weight: 600; line-height: 1.35; flex: 1; }
  .phrase .phonetic { color: var(--muted); font-size: 0.8rem; margin-top: 4px; font-style: italic; }
  .phrase .jp { color: var(--muted); font-size: 0.9rem; margin-top: 8px; }
  .speak-btn {
    background: var(--accent); border: none; color: #06192e; width: 40px; height: 40px;
    border-radius: 50%; font-size: 1.1rem; cursor: pointer; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; transition: transform 0.1s;
  }
  .speak-btn:active { transform: scale(0.9); }
  .phrase .actions { display: flex; gap: 8px; margin-top: 12px; }
  .learn-btn {
    flex: 1; background: transparent; border: 1px solid var(--panel-border); color: var(--muted);
    border-radius: 10px; padding: 8px; font-size: 0.78rem; cursor: pointer; font-family: inherit; font-weight: 600;
  }
  .learn-btn.learned { background: rgba(70,211,138,0.15); border-color: var(--good); color: var(--good); }
  .mic-btn {
    flex: 1; background: transparent; border: 1px solid rgba(255,207,92,0.4); color: var(--gold);
    border-radius: 10px; padding: 8px; font-size: 0.78rem; cursor: pointer; font-family: inherit; font-weight: 600;
  }
  .mic-btn.recording { background: rgba(255,122,122,0.18); border-color: var(--bad); color: var(--bad); animation: pulse 1s infinite; }
  .mic-btn:disabled { opacity: 0.4; cursor: default; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.55; } }
  .pron-result { margin-top: 10px; padding: 10px 12px; border-radius: 10px; font-size: 0.82rem; line-height: 1.6; display: none; }
  .pron-result.show { display: block; }
  .pron-result .heard { color: var(--muted); font-size: 0.76rem; margin-top: 4px; }
  .pron-result .score-line { font-weight: 700; }
  .pron-result.good { background: rgba(70,211,138,0.14); border: 1px solid rgba(70,211,138,0.4); }
  .pron-result.mid { background: rgba(255,207,92,0.14); border: 1px solid rgba(255,207,92,0.4); }
  .pron-result.low { background: rgba(255,122,122,0.14); border: 1px solid rgba(255,122,122,0.4); }
  .pron-result .word-ok { color: var(--good); }
  .pron-result .word-ng { color: var(--bad); text-decoration: underline; }

  /* Dialogue */
  .bubble { display: flex; margin-bottom: 12px; gap: 8px; align-items: flex-end; }
  .bubble.b { flex-direction: row-reverse; }
  .bubble .avatar {
    width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 1.1rem;
    background: var(--panel-2);
  }
  .bubble .msg {
    max-width: 78%; background: var(--panel); border: 1px solid var(--panel-border);
    padding: 10px 12px; border-radius: 14px;
  }
  .bubble.a .msg { border-bottom-left-radius: 4px; }
  .bubble.b .msg { border-bottom-right-radius: 4px; background: rgba(77,163,255,0.14); border-color: rgba(77,163,255,0.3); }
  .bubble .msg .en { font-weight: 600; font-size: 1rem; }
  .bubble .msg .jp { color: var(--muted); font-size: 0.78rem; margin-top: 4px; }
  .bubble .msg .sp { background: none; border: none; color: var(--accent); cursor: pointer; font-size: 0.9rem; padding: 0; margin-top: 4px; font-family: inherit; }

  /* Quiz */
  .quiz-card {
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 16px; padding: 22px 18px; text-align: center;
  }
  .quiz-q { font-size: 0.8rem; color: var(--muted); margin-bottom: 8px; }
  .quiz-prompt { font-size: 1.3rem; font-weight: 700; margin-bottom: 6px; line-height: 1.4; }
  .quiz-sub { color: var(--muted); font-size: 0.85rem; margin-bottom: 18px; }
  .listen-play {
    width: 84px; height: 84px; border-radius: 50%; border: none; cursor: pointer;
    background: var(--accent); color: #06192e; font-size: 2rem; margin: 4px auto 8px;
    display: flex; align-items: center; justify-content: center; transition: transform 0.1s;
    box-shadow: 0 8px 24px rgba(77,163,255,0.35);
  }
  .listen-play:active { transform: scale(0.92); }
  .quiz-opts { display: flex; flex-direction: column; gap: 10px; }
  .quiz-opt {
    background: var(--panel-2); border: 1px solid var(--panel-border); color: var(--text);
    padding: 13px; border-radius: 12px; font-size: 0.95rem; cursor: pointer;
    font-family: inherit; transition: all 0.12s; text-align: left;
  }
  .quiz-opt:hover:not(:disabled) { background: rgba(77,163,255,0.14); }
  .quiz-opt.correct { background: rgba(70,211,138,0.22); border-color: var(--good); }
  .quiz-opt.wrong { background: rgba(255,122,122,0.2); border-color: var(--bad); }
  .quiz-opt:disabled { cursor: default; }
  .quiz-progress { font-size: 0.75rem; color: var(--muted); margin-bottom: 14px; }
  .next-btn {
    margin-top: 16px; width: 100%; background: var(--accent); border: none; color: #06192e;
    padding: 13px; border-radius: 12px; font-size: 0.95rem; font-weight: 700; cursor: pointer;
    font-family: inherit; opacity: 0; pointer-events: none; transition: opacity 0.2s;
  }
  .next-btn.show { opacity: 1; pointer-events: auto; }
  .quiz-result { text-align: center; padding: 20px 0; }
  .quiz-result .big { font-size: 2.6rem; font-weight: 800; color: var(--gold); }
  .quiz-result .msg { font-size: 1.05rem; margin: 8px 0 6px; }
  .quiz-result .sub { color: var(--muted); font-size: 0.85rem; margin-bottom: 18px; }

  .word-en { display: inline; }
  .hint { color: var(--muted); font-size: 0.78rem; text-align: center; margin-top: 14px; line-height: 1.6; }
  .primary-btn {
    width: 100%; background: var(--accent); border: none; color: #06192e;
    padding: 14px; border-radius: 12px; font-size: 1rem; font-weight: 700; cursor: pointer;
    font-family: inherit; margin-top: 4px;
  }
  .empty { text-align: center; color: var(--muted); padding: 40px 20px; font-size: 0.9rem; line-height: 1.7; }
  footer { margin-top: 28px; color: var(--muted); font-size: 0.7rem; text-align: center; line-height: 1.7; }
  .reset-link { color: var(--muted); text-decoration: underline; cursor: pointer; background: none; border: none; font-family: inherit; font-size: 0.7rem; }
</style>
</head>
<body>
<header>
  <h1>はじめての英会話 🗣️</h1>
  <div class="subtitle">シーン別に「聞いて・話して」覚える英会話アプリ</div>
</header>

<div class="app">
  <div class="stats">
    <div class="stat"><div class="num" id="stat-learned">0</div><div class="lbl">覚えた表現</div></div>
    <div class="stat"><div class="num" id="stat-total">0</div><div class="lbl">全表現</div></div>
    <div class="stat"><div class="num" id="stat-streak">0</div><div class="lbl">連続日数</div></div>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="learn">📚 学ぶ</button>
    <button class="tab" data-tab="quiz">✏️ クイズ</button>
  </div>

  <!-- LEARN: category list -->
  <div class="screen active" id="screen-cats">
    <div class="cat-grid" id="cat-grid"></div>
  </div>

  <!-- LEARN: category detail -->
  <div class="screen" id="screen-detail">
    <button class="back" id="detail-back">← カテゴリ一覧へ</button>
    <div class="section-head">
      <h2 id="detail-title"></h2>
      <div class="mode-switch">
        <button class="mini-btn active" data-view="phrases">フレーズ</button>
        <button class="mini-btn" data-view="dialogue">会話例</button>
      </div>
    </div>
    <div id="detail-phrases"></div>
    <div id="detail-dialogue" style="display:none"></div>
  </div>

  <!-- QUIZ -->
  <div class="screen" id="screen-quiz">
    <div id="quiz-start">
      <div class="cat-card" style="text-align:center; cursor:default;">
        <div class="emoji">✏️</div>
        <div class="title" style="margin-top:8px;">4択クイズ</div>
        <div class="en" style="margin-top:6px; line-height:1.6;">全10問。まず出題タイプを選びましょう。</div>
      </div>
      <div class="mode-switch" style="margin-top:14px; display:flex; gap:8px;">
        <button class="mini-btn active" data-qmode="meaning" style="flex:1;">📖 意味から選ぶ</button>
        <button class="mini-btn" data-qmode="listening" style="flex:1;">🎧 リスニング</button>
      </div>
      <div class="hint" id="quiz-mode-desc">日本語の意味に合う英語表現を選びます。</div>
      <button class="primary-btn" id="quiz-begin" style="margin-top:6px;">クイズを始める</button>
      <div class="hint">覚えた表現がたまるほど、いろいろな表現から出題されます。</div>
    </div>
    <div id="quiz-play" style="display:none;">
      <div class="quiz-progress" id="quiz-progress"></div>
      <div class="quiz-card">
        <div class="quiz-q" id="quiz-q"></div>
        <button class="listen-play" id="quiz-listen" style="display:none;">🔊</button>
        <div class="quiz-prompt" id="quiz-prompt"></div>
        <div class="quiz-sub" id="quiz-sub"></div>
        <div class="quiz-opts" id="quiz-opts"></div>
      </div>
      <button class="next-btn" id="quiz-next">次の問題へ →</button>
    </div>
    <div id="quiz-done" style="display:none;">
      <div class="quiz-card">
        <div class="quiz-result">
          <div class="big" id="quiz-score"></div>
          <div class="msg" id="quiz-msg"></div>
          <div class="sub" id="quiz-detail"></div>
        </div>
        <button class="primary-btn" id="quiz-again">もう一度</button>
      </div>
    </div>
  </div>

  <footer>
    音声はブラウザの読み上げ機能を使用します（音が出ない場合は端末の音量をご確認ください）。<br>
    発音チェックはマイクの許可が必要です（Chrome / Edge / Safari 推奨）。<br>
    学習データはこのブラウザ内にのみ保存されます。 ·
    <button class="reset-link" id="reset-all">記録をリセット</button><br>
    <a class="reset-link" href="focus-timer.html">🌱 フォーカス・タイマー・ガーデンはこちら</a>
  </footer>
</div>

/* ---------- Storage ---------- */
const STORE_KEY = "eikaiwa_v1";
function loadState() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return { learned: {}, lastDay: null, streak: 0 };
}
function saveState() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {}
}
let state = loadState();

function todayStr() {
  const d = new Date();
  return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
}
function markActivity() {
  const t = todayStr();
  if (state.lastDay === t) return;
  const y = new Date(); y.setDate(y.getDate() - 1);
  const yStr = y.getFullYear() + "-" + (y.getMonth() + 1) + "-" + y.getDate();
  if (state.lastDay === yStr) state.streak = (state.streak || 0) + 1;
  else state.streak = 1;
  state.lastDay = t;
  saveState();
}

/* ---------- Helpers ---------- */
function phraseKey(catId, i) { return catId + ":" + i; }
function isLearned(catId, i) { return !!state.learned[phraseKey(catId, i)]; }
function totalPhrases() { return CATEGORIES.reduce((n, c) => n + c.phrases.length, 0); }
function learnedCount() { return Object.values(state.learned).filter(Boolean).length; }
function catLearnedCount(cat) {
  let n = 0;
  cat.phrases.forEach((_, i) => { if (isLearned(cat.id, i)) n++; });
  return n;
}

/* ---------- Speech ---------- */
let voices = [];
function refreshVoices() { voices = window.speechSynthesis ? speechSynthesis.getVoices() : []; }
if (window.speechSynthesis) {
  refreshVoices();
  speechSynthesis.onvoiceschanged = refreshVoices;
}
function speak(text) {
  if (!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US";
  u.rate = 0.9;
  const en = voices.find(v => /en[-_]US/i.test(v.lang)) || voices.find(v => /^en/i.test(v.lang));
  if (en) u.voice = en;
  speechSynthesis.speak(u);
}

/* ---------- Speech recognition (pronunciation check) ---------- */
const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
const speechRecSupported = !!SpeechRec;
let activeRec = null;

// Normalize a sentence into comparable words: lowercase, strip punctuation.
function toWords(text) {
  return text.toLowerCase()
    .replace(/[’']/g, "")
    .replace(/[^a-z0-9\s]/g, " ")
    .split(/\s+/)
    .filter(Boolean);
}
// Compare heard words against target; returns { score, marks } where marks
// is an array of {word, ok} for the TARGET words (in order).
function scorePronunciation(target, heard) {
  const tWords = toWords(target);
  const hWords = toWords(heard);
  const pool = {};
  hWords.forEach(w => { pool[w] = (pool[w] || 0) + 1; });
  let hit = 0;
  const marks = tWords.map(w => {
    if (pool[w] > 0) { pool[w]--; hit++; return { word: w, ok: true }; }
    return { word: w, ok: false };
  });
  const score = tWords.length ? Math.round((hit / tWords.length) * 100) : 0;
  return { score, marks };
}
// Start recognition for a phrase; callbacks report lifecycle.
function recognizeSpeech(onStart, onResult, onError, onEnd) {
  if (!speechRecSupported) { onError && onError("unsupported"); return null; }
  try {
    if (activeRec) { activeRec.abort(); activeRec = null; }
    const rec = new SpeechRec();
    rec.lang = "en-US";
    rec.interimResults = false;
    rec.maxAlternatives = 1;
    rec.continuous = false;
    let got = false;
    rec.onstart = () => onStart && onStart();
    rec.onresult = (e) => { got = true; onResult && onResult(e.results[0][0].transcript || ""); };
    rec.onerror = (e) => onError && onError(e.error || "error");
    rec.onend = () => { activeRec = null; onEnd && onEnd(got); };
    activeRec = rec;
    rec.start();
    return rec;
  } catch (err) {
    onError && onError("start-failed");
    return null;
  }
}

    catGrid.appendChild(btn);

      '</div>' +
      '<div class="pron-result"></div>';
    div.querySelector(".speak-btn").addEventListener("click", () => speak(p.en));
    div.querySelector(".learn-btn").addEventListener("click", () => {

      if (state.learned[key]) markActivity();
      saveState();
      renderPhrases();
      renderStats();
      renderCats();
    });
    const micBtn = div.querySelector(".mic-btn");
    const resultBox = div.querySelector(".pron-result");
    if (speechRecSupported) {
      micBtn.addEventListener("click", () => startPronCheck(p, i, micBtn, resultBox));
    }
    wrap.appendChild(div);
  });
}
function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function startPronCheck(p, i, micBtn, resultBox) {
  if (activeRec) { activeRec.abort(); activeRec = null; }
  resultBox.className = "pron-result show";
  resultBox.innerHTML = "🎤 マイクに向かって英語を話してください…";
  micBtn.classList.add("recording");
  micBtn.textContent = "● 録音中… (話してください)";
  const finish = () => { micBtn.classList.remove("recording"); micBtn.textContent = "🎤 もう一度チェック"; };
  recognizeSpeech(
    null,
    (transcript) => {
      const { score, marks } = scorePronunciation(p.en, transcript);
      const cls = score >= 80 ? "good" : score >= 50 ? "mid" : "low";
      const emoji = score >= 80 ? "🎉" : score >= 50 ? "👍" : "💪";
      const label = score >= 80 ? "とても上手！" : score >= 50 ? "いい調子！" : "もう一度チャレンジ！";
      const marked = marks.map(m =>
        '<span class="' + (m.ok ? "word-ok" : "word-ng") + '">' + escapeHtml(m.word) + '</span>'
      ).join(" ");
      resultBox.className = "pron-result show " + cls;
      resultBox.innerHTML =
        '<div class="score-line">' + emoji + ' スコア ' + score + '点 — ' + label + '</div>' +
        '<div style="margin-top:6px;">' + marked + '</div>' +
        '<div class="heard">認識された発音：' + (transcript ? escapeHtml(transcript) : "（聞き取れませんでした）") + '</div>';
      // A confident attempt counts as learning activity, and a great one marks it learned.
      markActivity();
      if (score >= 80 && !isLearned(currentCat.id, i)) {
        state.learned[phraseKey(currentCat.id, i)] = true;
        saveState();
        renderStats();
        renderCats();
      }
    },
    (err) => {
      let msg;
      if (err === "not-allowed" || err === "service-not-allowed")
        msg = "マイクの使用が許可されていません。ブラウザの設定を確認してください。";
      else if (err === "no-speech")
        msg = "音声を検出できませんでした。もう一度お試しください。";
      else if (err === "unsupported")
        msg = "このブラウザは音声認識に対応していません。";
      else
        msg = "音声認識でエラーが発生しました。もう一度お試しください。";
      resultBox.className = "pron-result show low";
      resultBox.textContent = "⚠️ " + msg;
    },
    (got) => {
      finish();
      if (!got && resultBox.innerHTML.indexOf("話してください") !== -1) {
        resultBox.className = "pron-result show mid";
        resultBox.textContent = "音声を検出できませんでした。もう一度お試しください。";
      }
    }
  );
}

/* ---------- Quiz ---------- */
let quiz = null;
function allPhrases() {
  const arr = [];
  CATEGORIES.forEach(c => c.phrases.forEach((p, i) => arr.push({ ...p, catId: c.id, idx: i, learned: isLearned(c.id, i) })));
  return arr;
}
function shuffle(a) {
  const arr = a.slice();
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
let quizMode = "meaning"; // "meaning" (JP→choose EN) or "listening" (audio→choose JP)
function buildQuiz() {
  const all = allPhrases();
  const learned = all.filter(p => p.learned);
  const pool = learned.length >= 4 ? learned : all;
  const questions = shuffle(pool).slice(0, Math.min(10, pool.length));
  quiz = { questions, i: 0, correct: 0, answered: false, mode: quizMode };
}
function resetQuizStart() {
  document.getElementById("quiz-start").style.display = "block";
  document.getElementById("quiz-play").style.display = "none";
  document.getElementById("quiz-done").style.display = "none";
}
function startQuiz() {
  buildQuiz();
  if (!quiz.questions.length) return;
  document.getElementById("quiz-start").style.display = "none";
  document.getElementById("quiz-done").style.display = "none";
  document.getElementById("quiz-play").style.display = "block";
  renderQuestion();
}
function renderQuestion() {
  quiz.answered = false;
  const q = quiz.questions[quiz.i];
  const listening = quiz.mode === "listening";
  document.getElementById("quiz-progress").textContent = "第 " + (quiz.i + 1) + " 問 / " + quiz.questions.length + " 問  ·  正解 " + quiz.correct;
  document.getElementById("quiz-q").textContent = listening ? "音声を聞いて意味を選ぼう" : "この意味の英語は？";
  document.getElementById("quiz-sub").textContent = "";
  const listenBtn = document.getElementById("quiz-listen");
  const promptEl = document.getElementById("quiz-prompt");
  const optsWrap = document.getElementById("quiz-opts");
  optsWrap.innerHTML = "";
  const all = allPhrases().filter(p => p.en !== q.en);
  const distractors = shuffle(all).slice(0, 3);
  const options = shuffle([q, ...distractors]);

  if (listening) {
    promptEl.style.display = "none";
    listenBtn.style.display = "flex";
    listenBtn.onclick = () => speak(q.en);
    setTimeout(() => speak(q.en), 250);
    options.forEach(opt => {
      const btn = document.createElement("button");
      btn.className = "quiz-opt";
      btn.textContent = opt.jp;
      btn.addEventListener("click", () => answer(btn, opt, q));
      optsWrap.appendChild(btn);
    });
  } else {
    listenBtn.style.display = "none";
    promptEl.style.display = "block";
    promptEl.textContent = q.jp;
    options.forEach(opt => {
      const btn = document.createElement("button");
      btn.className = "quiz-opt";
      btn.textContent = opt.en;
      btn.addEventListener("click", () => answer(btn, opt, q));
      optsWrap.appendChild(btn);
    });
  }
  document.getElementById("quiz-next").classList.remove("show");
}
function answer(btn, opt, q) {
  if (quiz.answered) return;
  quiz.answered = true;
  markActivity();
  const listening = quiz.mode === "listening";
  const correctText = listening ? q.jp : q.en;
  const correct = (listening ? opt.jp : opt.en) === correctText;
  document.querySelectorAll(".quiz-opt").forEach(b => {
    b.disabled = true;
    if (b.textContent === correctText) b.classList.add("correct");
  });
  if (!correct) btn.classList.add("wrong");
  if (correct) quiz.correct++;
  speak(q.en);
  document.getElementById("quiz-sub").textContent = listening ? (q.en + "  /  " + q.ph) : q.ph;
  const nextBtn = document.getElementById("quiz-next");
  nextBtn.textContent = quiz.i + 1 < quiz.questions.length ? "次の問題へ →" : "結果を見る →";
  nextBtn.classList.add("show");
}
document.getElementById("quiz-next").addEventListener("click", () => {
  quiz.i++;
  if (quiz.i < quiz.questions.length) renderQuestion();
  else finishQuiz();
});
function finishQuiz() {
  document.getElementById("quiz-play").style.display = "none";
  document.getElementById("quiz-done").style.display = "block";
  const total = quiz.questions.length;
  const pct = Math.round((quiz.correct / total) * 100);
  document.getElementById("quiz-score").textContent = quiz.correct + " / " + total;
  let msg, sub;
  if (pct === 100) { msg = "パーフェクト！🎉"; sub = "すべて正解です。すばらしい！"; }
  else if (pct >= 70) { msg = "よくできました！👏"; sub = "その調子で続けましょう。"; }
  else if (pct >= 40) { msg = "あと少し！💪"; sub = "「学ぶ」で復習してみましょう。"; }
  else { msg = "これから伸びます！🌱"; sub = "まずは各シーンのフレーズを聞いてみましょう。"; }
  document.getElementById("quiz-msg").textContent = msg;
  document.getElementById("quiz-detail").textContent = sub;
  saveState();
  renderStats();
}
document.querySelectorAll("[data-qmode]").forEach(b => b.addEventListener("click", () => {
  quizMode = b.dataset.qmode;
  document.querySelectorAll("[data-qmode]").forEach(x => x.classList.toggle("active", x === b));
  document.getElementById("quiz-mode-desc").textContent = quizMode === "listening"
    ? "英語の音声を聞いて、正しい意味を選びます。"
    : "日本語の意味に合う英語表現を選びます。";
}));
document.getElementById("quiz-begin").addEventListener("click", startQuiz);
document.getElementById("quiz-again").addEventListener("click", startQuiz);

/* ---------- Reset ---------- */
document.getElementById("reset-all").addEventListener("click", () => {
  if (confirm("覚えた記録と連続日数をすべて消去します。よろしいですか？")) {
    state = { learned: {}, lastDay: null, streak: 0 };
    saveState();
    renderStats();
    renderCats();
  }
});

/* ---------- Init ---------- */
renderStats();
renderCats();
</script>
