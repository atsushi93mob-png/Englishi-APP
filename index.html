<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>フォーカス・タイマー・ガーデン 🌱</title>
<style>
  :root, [data-theme="dark"] {
    --bg1: #1a2a3a;
    --bg2: #2d4a5a;
    --accent: #7ed957;
    --accent-dark: #5cb03a;
    --break: #ffb347;
    --text: #eaf6ec;
    --muted: #9fb8ac;
    --panel: rgba(255,255,255,0.06);
    --panel-border: rgba(255,255,255,0.12);
    --field: rgba(0,0,0,0.25);
    --field-text: #eaf6ec;
    --soil1: #6b4a2f;
    --soil2: #4a3220;
    --ring-track: rgba(255,255,255,0.08);
    --overlay: rgba(6,14,20,0.6);
  }
  [data-theme="light"] {
    --bg1: #dff0e4;
    --bg2: #b8dcc6;
    --accent: #3fa34d;
    --accent-dark: #2f8039;
    --break: #e08a2b;
    --text: #1c2b22;
    --muted: #5c7266;
    --panel: rgba(255,255,255,0.55);
    --panel-border: rgba(0,0,0,0.10);
    --field: rgba(255,255,255,0.7);
    --field-text: #1c2b22;
    --soil1: #a9764a;
    --soil2: #7c5533;
    --ring-track: rgba(0,0,0,0.10);
    --overlay: rgba(20,40,30,0.4);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    background: radial-gradient(circle at 50% 0%, var(--bg2), var(--bg1) 70%);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 16px 0;
    -webkit-user-select: none;
    user-select: none;
    transition: background 0.4s, color 0.4s;
  }

  .topbar {
    width: min(760px, 96vw);
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
  }
  .titles { text-align: center; flex: 1; }
  h1 {
    font-size: 1.4rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    margin-bottom: 4px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }
  .subtitle { color: var(--muted); font-size: 0.85rem; margin-bottom: 18px; }
  .icon-btns { display: flex; gap: 6px; }
  .icon-btn {
    border: 1px solid var(--panel-border);
    background: var(--panel);
    color: var(--text);
    width: 38px; height: 38px;
    border-radius: 12px;
    cursor: pointer;
    font-size: 1.1rem;
    display: flex; align-items: center; justify-content: center;
    transition: filter 0.2s, transform 0.1s;
    backdrop-filter: blur(8px);
  }
  .icon-btn:hover { filter: brightness(1.15); }
  .icon-btn:active { transform: scale(0.92); }

  .timer-card {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 24px;
    padding: 24px 28px 26px;
    backdrop-filter: blur(8px);
    box-shadow: 0 10px 40px rgba(0,0,0,0.18);
    text-align: center;
    width: 360px;
    max-width: 100%;
  }
  .mode-tabs {
    display: flex;
    gap: 6px;
    background: rgba(0,0,0,0.16);
    border-radius: 999px;
    padding: 4px;
    margin-bottom: 18px;
  }
  .mode-tabs button {
    flex: 1;
    border: none;
    background: transparent;
    color: var(--muted);
    font-size: 0.8rem;
    padding: 8px 4px;
    border-radius: 999px;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
  }
  .mode-tabs button.active {
    background: var(--accent);
    color: #fff;
    font-weight: 600;
  }
  .mode-tabs button.active.break-mode { background: var(--break); }

  .task-row {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--field);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    padding: 6px 10px;
    margin-bottom: 16px;
  }
  .task-row .tico { font-size: 0.95rem; opacity: 0.8; }
  .task-row input {
    flex: 1;
    border: none;
    background: transparent;
    color: var(--field-text);
    font-family: inherit;
    font-size: 0.85rem;
    outline: none;
  }
  .task-row input::placeholder { color: var(--muted); }

  .ring-wrap { position: relative; width: 220px; height: 220px; margin: 0 auto 16px; }
  svg.ring { transform: rotate(-90deg); }
  .ring-bg { fill: none; stroke: var(--ring-track); stroke-width: 12; }
  .ring-fg {
    fill: none;
    stroke: var(--accent);
    stroke-width: 12;
    stroke-linecap: round;
    transition: stroke-dashoffset 0.3s linear, stroke 0.3s;
  }
  .ring-fg.break-mode { stroke: var(--break); }
  .time-display {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .time-display .time {
    font-size: 3rem;
    font-weight: 300;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.02em;
  }
  .time-display .label { color: var(--muted); font-size: 0.8rem; margin-top: 2px; }

  .controls { display: flex; gap: 10px; justify-content: center; margin-top: 8px; }
  .controls button {
    border: none;
    border-radius: 12px;
    padding: 12px 20px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: transform 0.1s, filter 0.2s;
  }
  .controls button:active { transform: scale(0.95); }
  .btn-primary { background: var(--accent); color: #fff; flex: 1; }
  .btn-primary.break-mode { background: var(--break); }
  .btn-secondary { background: rgba(127,127,127,0.18); color: var(--text); }
  .btn-secondary:hover { filter: brightness(1.2); }

  .stats {
    display: flex;
    justify-content: space-around;
    margin: 20px 0 6px;
    width: 360px;
    max-width: 100%;
  }
  .stat { text-align: center; }
  .stat .num { font-size: 1.5rem; font-weight: 600; color: var(--accent); }
  .stat .cap { font-size: 0.72rem; color: var(--muted); }

  /* Weekly chart */
  .chart-wrap {
    width: 360px; max-width: 100%;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 16px;
    padding: 12px 14px 8px;
    margin-top: 10px;
    backdrop-filter: blur(8px);
  }
  .chart-title { font-size: 0.72rem; color: var(--muted); margin-bottom: 8px; }
  .chart {
    display: flex; align-items: flex-end; justify-content: space-between;
    height: 70px; gap: 6px;
  }
  .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; }
  .bar-track { flex: 1; width: 100%; display: flex; align-items: flex-end; }
  .bar {
    width: 100%; border-radius: 4px 4px 0 0; min-height: 2px;
    background: var(--accent);
    transition: height 0.4s ease;
  }
  .bar.today { background: var(--break); }
  .bar-lbl { font-size: 0.62rem; color: var(--muted); }
  .bar-val { font-size: 0.6rem; color: var(--muted); height: 0.8em; }

  .garden-wrap {
    width: min(760px, 96vw);
    margin-top: 12px;
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  .garden-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 0 4px 8px;
  }
  .garden-header h2 { font-size: 0.95rem; font-weight: 600; color: var(--text); }
  .garden {
    background: linear-gradient(to bottom, rgba(120,180,220,0.10), rgba(90,150,90,0.18));
    border: 1px solid var(--panel-border);
    border-radius: 20px 20px 0 0;
    min-height: 180px;
    position: relative;
    overflow: hidden;
    flex: 1;
    display: flex;
    align-items: flex-end;
    flex-wrap: wrap;
    padding: 12px 16px 0;
    gap: 2px;
  }
  .garden::after {
    content: "";
    position: absolute; left: 0; right: 0; bottom: 0; height: 34px;
    background: linear-gradient(to bottom, var(--soil1), var(--soil2));
    z-index: 0;
  }
  .plant {
    position: relative;
    z-index: 1;
    width: 44px;
    height: 84px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    cursor: pointer;
    animation: sprout 0.6s cubic-bezier(.34,1.56,.64,1);
    transform-origin: bottom center;
  }
  @keyframes sprout {
    0% { transform: scale(0) translateY(10px); opacity: 0; }
    100% { transform: scale(1) translateY(0); opacity: 1; }
  }
  .plant svg { overflow: visible; }
  .empty-msg {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 0.85rem; z-index: 1;
    text-align: center; padding: 20px;
  }
  .sway { animation: sway 4s ease-in-out infinite; transform-origin: bottom center; }
  @keyframes sway {
    0%,100% { transform: rotate(-2deg); }
    50% { transform: rotate(2deg); }
  }

  footer { color: var(--muted); font-size: 0.7rem; padding: 14px; text-align: center; }
  .link-btn {
    background: none; border: none; color: var(--muted); cursor: pointer;
    font-size: 0.72rem; text-decoration: underline; font-family: inherit;
  }
  .link-btn:hover { color: var(--text); }

  /* Toast */
  .toast {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-80px);
    background: var(--accent); color: #fff; padding: 12px 22px; border-radius: 999px;
    font-weight: 600; font-size: 0.9rem; box-shadow: 0 6px 24px rgba(0,0,0,0.3);
    opacity: 0; transition: all 0.4s cubic-bezier(.34,1.56,.64,1); z-index: 100;
    pointer-events: none; max-width: 90vw; text-align: center;
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

  /* Plant tooltip */
  .tip {
    position: fixed; z-index: 120; pointer-events: none;
    background: rgba(10,20,16,0.92); color: #eaf6ec;
    border: 1px solid rgba(255,255,255,0.15);
    padding: 7px 11px; border-radius: 10px; font-size: 0.74rem;
    box-shadow: 0 6px 20px rgba(0,0,0,0.35);
    opacity: 0; transition: opacity 0.15s; max-width: 220px;
  }
  .tip.show { opacity: 1; }
  .tip .tip-task { font-weight: 600; margin-bottom: 2px; }
  .tip .tip-date { color: #9fb8ac; font-size: 0.68rem; }

  /* Settings modal */
  .modal-overlay {
    position: fixed; inset: 0; background: var(--overlay);
    display: none; align-items: center; justify-content: center; z-index: 200;
    padding: 16px; backdrop-filter: blur(3px);
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: var(--bg1);
    border: 1px solid var(--panel-border);
    border-radius: 20px; padding: 22px 22px 18px;
    width: 340px; max-width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    max-height: 90vh; overflow-y: auto;
  }
  .modal h3 { font-size: 1.05rem; margin-bottom: 16px; }
  .setting-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 9px 0; border-bottom: 1px solid var(--panel-border); gap: 12px;
  }
  .setting-row:last-of-type { border-bottom: none; }
  .setting-row label { font-size: 0.85rem; }
  .setting-row .hint { font-size: 0.68rem; color: var(--muted); margin-top: 2px; }
  .setting-row input[type="number"] {
    width: 62px; text-align: center;
    background: var(--field); color: var(--field-text);
    border: 1px solid var(--panel-border); border-radius: 8px;
    padding: 6px; font-family: inherit; font-size: 0.85rem;
  }
  /* toggle switch */
  .switch { position: relative; width: 44px; height: 24px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; inset: 0; cursor: pointer;
    background: rgba(127,127,127,0.35); border-radius: 999px; transition: 0.2s;
  }
  .slider::before {
    content: ""; position: absolute; width: 18px; height: 18px; left: 3px; top: 3px;
    background: #fff; border-radius: 50%; transition: 0.2s;
  }
  .switch input:checked + .slider { background: var(--accent); }
  .switch input:checked + .slider::before { transform: translateX(20px); }
  .modal-actions { display: flex; gap: 10px; margin-top: 18px; }
  .modal-actions button {
    flex: 1; border: none; border-radius: 12px; padding: 11px;
    font-weight: 600; font-family: inherit; cursor: pointer; font-size: 0.9rem;
    transition: filter 0.2s, transform 0.1s;
  }
  .modal-actions button:active { transform: scale(0.96); }
  .btn-save { background: var(--accent); color: #fff; }
  .btn-cancel { background: rgba(127,127,127,0.2); color: var(--text); }
  .danger-zone { margin-top: 14px; text-align: center; }
</style>
</head>
<body>
  <div class="topbar">
    <div class="icon-btns" style="visibility:hidden">
      <button class="icon-btn">⚙</button>
    </div>
    <div class="titles">
      <h1>🌱 フォーカス・タイマー・ガーデン</h1>
      <div class="subtitle">集中するたびに、庭に植物が育ちます</div>
    </div>
    <div class="icon-btns">
      <button class="icon-btn" id="themeBtn" title="テーマ切替">🌙</button>
      <button class="icon-btn" id="settingsBtn" title="設定">⚙</button>
    </div>
  </div>

  <div class="timer-card">
    <div class="mode-tabs">
      <button data-mode="focus" class="active">集中</button>
      <button data-mode="short">休憩</button>
      <button data-mode="long">長休憩</button>
    </div>

    <div class="task-row">
      <span class="tico">✏️</span>
      <input type="text" id="taskInput" maxlength="60" placeholder="今取り組むこと（任意）">
    </div>

    <div class="ring-wrap">
      <svg class="ring" width="220" height="220" viewBox="0 0 220 220">
        <circle class="ring-bg" cx="110" cy="110" r="100"></circle>
        <circle class="ring-fg" cx="110" cy="110" r="100"
          stroke-dasharray="628.3" stroke-dashoffset="0"></circle>
      </svg>
      <div class="time-display">
        <div class="time" id="time">25:00</div>
        <div class="label" id="modeLabel">集中タイム</div>
      </div>
    </div>

    <div class="controls">
      <button class="btn-primary" id="startBtn">スタート</button>
      <button class="btn-secondary" id="resetBtn">リセット</button>
      <button class="btn-secondary" id="skipBtn">スキップ</button>
    </div>
  </div>

  <div class="stats">
    <div class="stat"><div class="num" id="statToday">0</div><div class="cap">今日の集中</div></div>
    <div class="stat"><div class="num" id="statTotal">0</div><div class="cap">植えた総数</div></div>
    <div class="stat"><div class="num" id="statStreak">0</div><div class="cap">連続日数</div></div>
  </div>

  <div class="chart-wrap">
    <div class="chart-title">直近7日間の集中</div>
    <div class="chart" id="chart"></div>
  </div>

  <div class="garden-wrap">
    <div class="garden-header">
      <h2>あなたの庭</h2>
      <button class="link-btn" id="clearBtn">庭をリセット</button>
    </div>
    <div class="garden" id="garden">
      <div class="empty-msg" id="emptyMsg">まだ何も植わっていません。<br>集中セッションを1つ完了すると、最初の芽が出ます 🌱</div>
    </div>
  </div>

  <footer>集中セッション完了ごとに植物が1つ育ちます · データはこのブラウザに保存されます</footer>

  <div class="toast" id="toast"></div>
  <div class="tip" id="tip"><div class="tip-task"></div><div class="tip-date"></div></div>

  <!-- Settings modal -->
  <div class="modal-overlay" id="settingsModal">
    <div class="modal">
      <h3>⚙ 設定</h3>
      <div class="setting-row">
        <div><label>集中の長さ</label><div class="hint">分</div></div>
        <input type="number" id="setFocus" min="1" max="180">
      </div>
      <div class="setting-row">
        <div><label>小休憩の長さ</label><div class="hint">分</div></div>
        <input type="number" id="setShort" min="1" max="60">
      </div>
      <div class="setting-row">
        <div><label>長休憩の長さ</label><div class="hint">分</div></div>
        <input type="number" id="setLong" min="1" max="60">
      </div>
      <div class="setting-row">
        <div><label>完了サウンド</label><div class="hint">終了時に和音を鳴らす</div></div>
        <label class="switch"><input type="checkbox" id="setSound"><span class="slider"></span></label>
      </div>
      <div class="setting-row">
        <div><label>デスクトップ通知</label><div class="hint">セッション完了を通知</div></div>
        <label class="switch"><input type="checkbox" id="setNotify"><span class="slider"></span></label>
      </div>
      <div class="setting-row">
        <div><label>自動で次を開始</label><div class="hint">休憩⇔集中を自動スタート</div></div>
        <label class="switch"><input type="checkbox" id="setAuto"><span class="slider"></span></label>
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" id="setCancel">キャンセル</button>
        <button class="btn-save" id="setSave">保存</button>
      </div>
    </div>
  </div>

<script>
(function () {
  "use strict";

  const RING_CIRC = 2 * Math.PI * 100; // 628.3
  const STORE_KEY = "focusGarden.v1";
  const MODE_LABELS = { focus: "集中タイム", short: "小休憩", long: "長い休憩" };
  const DEFAULT_SETTINGS = {
    focus: 25, short: 5, long: 15,
    sound: true, notify: false, auto: false, theme: "dark"
  };

  // ---- State ----
  let data = loadData();
  let mode = "focus";
  let remaining = durationOf(mode);
  let running = false;
  let ticker = null;
  let endTime = 0;

  // ---- Elements ----
  const el = (id) => document.getElementById(id);
  const timeEl = el("time");
  const modeLabelEl = el("modeLabel");
  const ringFg = document.querySelector(".ring-fg");
  const startBtn = el("startBtn");
  const gardenEl = el("garden");
  const emptyMsg = el("emptyMsg");
  const toast = el("toast");
  const tip = el("tip");
  const taskInput = el("taskInput");
  const chartEl = el("chart");
  const tabs = document.querySelectorAll(".mode-tabs button");
  const primaryBtn = document.querySelector(".btn-primary");
  const activeTab = () => document.querySelector(".mode-tabs button.active");

  // ---- Persistence ----
  function loadData() {
    let d = null;
    try { d = JSON.parse(localStorage.getItem(STORE_KEY)); } catch (e) {}
    if (!d || typeof d !== "object") d = {};
    if (!Array.isArray(d.plants)) d.plants = [];
    // migrate v1 plants (plain seed numbers) -> {seed, task, ts}
    d.plants = d.plants.map(p =>
      (typeof p === "number") ? { seed: p, task: "", ts: null } : p
    );
    if (typeof d.totalCompleted !== "number") d.totalCompleted = d.plants.length;
    if (!d.days || typeof d.days !== "object") d.days = {};
    d.settings = Object.assign({}, DEFAULT_SETTINGS, d.settings || {});
    return d;
  }
  function saveData() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(data)); } catch (e) {}
  }
  function durationOf(m) { return (data.settings[m] || DEFAULT_SETTINGS[m]) * 60; }

  function todayKey() { return dayKey(new Date()); }
  function dayKey(dt) {
    return dt.getFullYear() + "-" + (dt.getMonth() + 1) + "-" + dt.getDate();
  }

  // ---- Timer core ----
  function setMode(newMode) {
    mode = newMode;
    remaining = durationOf(mode);
    stop();
    tabs.forEach(t => t.classList.toggle("active", t.dataset.mode === mode));
    const isBreak = mode !== "focus";
    activeTab().classList.toggle("break-mode", isBreak);
    ringFg.classList.toggle("break-mode", isBreak);
    primaryBtn.classList.toggle("break-mode", isBreak);
    modeLabelEl.textContent = MODE_LABELS[mode];
    render();
  }

  function start() {
    if (running) return;
    running = true;
    endTime = Date.now() + remaining * 1000;
    startBtn.textContent = "一時停止";
    ticker = setInterval(tick, 200);
    tick();
  }
  function pause() {
    if (!running) return;
    running = false;
    remaining = Math.max(0, Math.round((endTime - Date.now()) / 1000));
    clearInterval(ticker);
    startBtn.textContent = "再開";
  }
  function stop() {
    running = false;
    clearInterval(ticker);
    startBtn.textContent = "スタート";
  }
  function reset() {
    remaining = durationOf(mode);
    stop();
    render();
  }
  function tick() {
    remaining = Math.max(0, Math.round((endTime - Date.now()) / 1000));
    if (remaining <= 0) { complete(); return; }
    render();
  }

  function complete() {
    stop();
    remaining = 0;
    render();
    if (data.settings.sound) beep();
    if (mode === "focus") {
      const task = taskInput.value.trim();
      addPlant(task);
      showToast("🌱 集中完了！植物が育ちました");
      notify("集中セッション完了 🌱", task ? "「" + task + "」を達成しました" : "植物が1つ育ちました");
      const nextMode = data.plants.length % 4 === 0 ? "long" : "short";
      setTimeout(() => { setMode(nextMode); if (data.settings.auto) start(); }, 900);
    } else {
      showToast("☕ 休憩おわり。次の集中へ！");
      notify("休憩おわり ☕", "次の集中セッションを始めましょう");
      setTimeout(() => { setMode("focus"); if (data.settings.auto) start(); }, 900);
    }
  }

  // ---- Garden ----
  function addPlant(task) {
    const plant = { seed: Math.floor(Math.random() * 1e9), task: task || "", ts: Date.now() };
    data.plants.push(plant);
    data.totalCompleted += 1;
    const tk = todayKey();
    data.days[tk] = (data.days[tk] || 0) + 1;
    saveData();
    renderStats();
    renderChart();
    renderNewPlant(plant);
  }

  // Deterministic pseudo-random from a seed
  function rng(seed) {
    let s = seed % 2147483647;
    if (s <= 0) s += 2147483646;
    return function () { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
  }

  const FLOWER_COLORS = ["#ff6b9d","#ffd93d","#ff8c42","#c77dff","#4ea8de","#ffffff","#ff5c8a"];
  const LEAF_COLORS = ["#7ed957","#5cb03a","#69b34c","#8fd14f","#4caf50"];

  function makePlantSVG(seed) {
    const r = rng(seed);
    const type = Math.floor(r() * 3); // 0 flower, 1 bush, 2 tree
    const leaf = LEAF_COLORS[Math.floor(r() * LEAF_COLORS.length)];
    const flower = FLOWER_COLORS[Math.floor(r() * FLOWER_COLORS.length)];
    const h = 46 + Math.floor(r() * 30);
    const bend = (r() - 0.5) * 10;
    let inner = "";

    // stem
    inner += `<path d="M22 84 Q${22 + bend} ${84 - h/2} 22 ${84 - h}" stroke="${leaf}" stroke-width="3" fill="none" stroke-linecap="round"/>`;
    // leaves
    inner += `<ellipse cx="14" cy="${84 - h*0.45}" rx="9" ry="4.5" fill="${leaf}" transform="rotate(-30 14 ${84 - h*0.45})"/>`;
    inner += `<ellipse cx="30" cy="${84 - h*0.62}" rx="9" ry="4.5" fill="${leaf}" transform="rotate(30 30 ${84 - h*0.62})"/>`;

    const topY = 84 - h;
    if (type === 0) {
      const petals = 5 + Math.floor(r() * 3);
      for (let i = 0; i < petals; i++) {
        const ang = (i / petals) * Math.PI * 2;
        const px = 22 + Math.cos(ang) * 8;
        const py = topY + Math.sin(ang) * 8;
        inner += `<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="5" fill="${flower}"/>`;
      }
      inner += `<circle cx="22" cy="${topY}" r="5" fill="#ffd93d"/>`;
    } else if (type === 1) {
      inner += `<circle cx="22" cy="${topY + 2}" r="12" fill="${leaf}"/>`;
      inner += `<circle cx="15" cy="${topY + 6}" r="9" fill="${leaf}"/>`;
      inner += `<circle cx="29" cy="${topY + 6}" r="9" fill="${leaf}"/>`;
      for (let i = 0; i < 4; i++) {
        inner += `<circle cx="${(14 + r()*16).toFixed(1)}" cy="${(topY + r()*10).toFixed(1)}" r="2.5" fill="${flower}"/>`;
      }
    } else {
      inner += `<circle cx="22" cy="${topY + 4}" r="14" fill="${leaf}"/>`;
      inner += `<circle cx="22" cy="${topY - 4}" r="10" fill="${leaf}"/>`;
      inner += `<circle cx="14" cy="${topY + 2}" r="8" fill="${leaf}"/>`;
      inner += `<circle cx="30" cy="${topY + 2}" r="8" fill="${leaf}"/>`;
    }
    return `<svg width="44" height="84" viewBox="0 0 44 84"><g class="sway">${inner}</g></svg>`;
  }

  function plantEl(plant, animate) {
    const div = document.createElement("div");
    div.className = "plant";
    if (!animate) div.style.animation = "none";
    div.innerHTML = makePlantSVG(plant.seed);
    div.dataset.task = plant.task || "";
    div.dataset.ts = plant.ts || "";
    return div;
  }

  function renderNewPlant(plant) {
    emptyMsg.style.display = "none";
    gardenEl.appendChild(plantEl(plant, true));
  }

  function renderGarden() {
    gardenEl.querySelectorAll(".plant").forEach(p => p.remove());
    if (data.plants.length === 0) {
      emptyMsg.style.display = "flex";
      return;
    }
    emptyMsg.style.display = "none";
    // cap visible plants for performance, keep most recent
    const visible = data.plants.slice(-120);
    for (const plant of visible) gardenEl.appendChild(plantEl(plant, false));
  }

  // ---- Plant tooltip ----
  function fmtDate(ts) {
    if (!ts) return "";
    const d = new Date(Number(ts));
    const pad = (n) => String(n).padStart(2, "0");
    return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }
  gardenEl.addEventListener("pointerover", (e) => {
    const p = e.target.closest(".plant");
    if (!p) return;
    const task = p.dataset.task;
    const date = fmtDate(p.dataset.ts);
    tip.querySelector(".tip-task").textContent = task || "集中セッション";
    tip.querySelector(".tip-date").textContent = date || "";
    const rect = p.getBoundingClientRect();
    tip.classList.add("show");
    const tw = tip.offsetWidth;
    let left = rect.left + rect.width / 2 - tw / 2;
    left = Math.max(8, Math.min(left, window.innerWidth - tw - 8));
    tip.style.left = left + "px";
    tip.style.top = (rect.top - tip.offsetHeight - 8) + "px";
  });
  gardenEl.addEventListener("pointerout", (e) => {
    if (!e.relatedTarget || !e.relatedTarget.closest || !e.relatedTarget.closest(".plant")) {
      tip.classList.remove("show");
    }
  });

  // ---- Stats & chart ----
  function computeStreak() {
    let streak = 0;
    const d = new Date();
    for (;;) {
      if (data.days[dayKey(d)] > 0) { streak++; d.setDate(d.getDate() - 1); }
      else break;
    }
    return streak;
  }
  function renderStats() {
    el("statToday").textContent = data.days[todayKey()] || 0;
    el("statTotal").textContent = data.totalCompleted;
    el("statStreak").textContent = computeStreak();
  }
  const WEEKDAYS = ["日","月","火","水","木","金","土"];
  function renderChart() {
    const days = [];
    const d = new Date();
    for (let i = 6; i >= 0; i--) {
      const dt = new Date(d);
      dt.setDate(d.getDate() - i);
      days.push({ dt, count: data.days[dayKey(dt)] || 0 });
    }
    const max = Math.max(1, ...days.map(x => x.count));
    chartEl.innerHTML = "";
    days.forEach((x, idx) => {
      const col = document.createElement("div");
      col.className = "bar-col";
      const val = document.createElement("div");
      val.className = "bar-val";
      val.textContent = x.count > 0 ? x.count : "";
      const track = document.createElement("div");
      track.className = "bar-track";
      const bar = document.createElement("div");
      bar.className = "bar" + (idx === 6 ? " today" : "");
      bar.style.height = Math.round((x.count / max) * 100) + "%";
      track.appendChild(bar);
      const lbl = document.createElement("div");
      lbl.className = "bar-lbl";
      lbl.textContent = WEEKDAYS[x.dt.getDay()];
      col.appendChild(val); col.appendChild(track); col.appendChild(lbl);
      chartEl.appendChild(col);
    });
  }

  // ---- Render timer ----
  function fmt(s) {
    const m = Math.floor(s / 60), sec = s % 60;
    return String(m).padStart(2, "0") + ":" + String(sec).padStart(2, "0");
  }
  function render() {
    timeEl.textContent = fmt(remaining);
    const frac = remaining / durationOf(mode);
    ringFg.style.strokeDasharray = RING_CIRC;
    ringFg.style.strokeDashoffset = RING_CIRC * (1 - frac);
    document.title = (running ? fmt(remaining) + " · " : "") + "フォーカス・ガーデン";
  }

  // ---- Feedback ----
  let toastTimer = null;
  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove("show"), 2600);
  }
  function beep() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const notes = [523.25, 659.25, 783.99]; // C E G
      notes.forEach((f, i) => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = "sine"; o.frequency.value = f;
        o.connect(g); g.connect(ctx.destination);
        const t = ctx.currentTime + i * 0.13;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.25, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.4);
        o.start(t); o.stop(t + 0.42);
      });
    } catch (e) {}
  }
  function notify(title, body) {
    if (!data.settings.notify) return;
    try {
      if (typeof Notification === "undefined") return;
      if (Notification.permission === "granted") {
        new Notification(title, { body: body, icon: "" });
      }
    } catch (e) {}
  }

  // ---- Theme ----
  function applyTheme() {
    document.documentElement.setAttribute("data-theme", data.settings.theme);
    el("themeBtn").textContent = data.settings.theme === "dark" ? "🌙" : "☀️";
  }
  function toggleTheme() {
    data.settings.theme = data.settings.theme === "dark" ? "light" : "dark";
    saveData();
    applyTheme();
  }

  // ---- Settings modal ----
  const modal = el("settingsModal");
  function openSettings() {
    el("setFocus").value = data.settings.focus;
    el("setShort").value = data.settings.short;
    el("setLong").value = data.settings.long;
    el("setSound").checked = data.settings.sound;
    el("setNotify").checked = data.settings.notify;
    el("setAuto").checked = data.settings.auto;
    modal.classList.add("show");
  }
  function closeSettings() { modal.classList.remove("show"); }
  function clampInt(v, min, max, dflt) {
    v = parseInt(v, 10);
    if (isNaN(v)) return dflt;
    return Math.max(min, Math.min(max, v));
  }
  function saveSettings() {
    const s = data.settings;
    s.focus = clampInt(el("setFocus").value, 1, 180, 25);
    s.short = clampInt(el("setShort").value, 1, 60, 5);
    s.long  = clampInt(el("setLong").value, 1, 60, 15);
    s.sound = el("setSound").checked;
    s.auto  = el("setAuto").checked;
    const wantNotify = el("setNotify").checked;
    if (wantNotify && typeof Notification !== "undefined" && Notification.permission === "default") {
      Notification.requestPermission().then((perm) => {
        s.notify = (perm === "granted");
        saveData();
        if (!s.notify) showToast("通知が許可されませんでした");
      });
    } else {
      s.notify = wantNotify && (typeof Notification === "undefined" ? false : Notification.permission === "granted");
    }
    saveData();
    closeSettings();
    if (!running) { remaining = durationOf(mode); render(); }
    showToast("設定を保存しました");
  }

  // ---- Events ----
  startBtn.addEventListener("click", () => { running ? pause() : start(); });
  el("resetBtn").addEventListener("click", reset);
  el("skipBtn").addEventListener("click", complete);
  tabs.forEach(t => t.addEventListener("click", () => setMode(t.dataset.mode)));
  el("themeBtn").addEventListener("click", toggleTheme);
  el("settingsBtn").addEventListener("click", openSettings);
  el("setCancel").addEventListener("click", closeSettings);
  el("setSave").addEventListener("click", saveSettings);
  modal.addEventListener("click", (e) => { if (e.target === modal) closeSettings(); });
  el("clearBtn").addEventListener("click", () => {
    if (confirm("庭のすべての植物と記録を消しますか？この操作は元に戻せません。")) {
      const keepSettings = data.settings;
      data = { plants: [], totalCompleted: 0, days: {}, settings: keepSettings };
      saveData(); renderGarden(); renderStats(); renderChart();
    }
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && modal.classList.contains("show")) { closeSettings(); return; }
    if (e.code === "Space" && e.target === document.body) { e.preventDefault(); running ? pause() : start(); }
  });

  // ---- Init ----
  applyTheme();
  setMode("focus");
  renderGarden();
  renderStats();
  renderChart();
  render();
})();
</script>
</body>
</html>
